version: '3.8'

services:
  mongodb:
    image: mongo:5
    container_name: home-library-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-library-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - app_network
    environment:
      - NODE_ENV=production
      - PORT=5010
      - MONGO_URI=mongodb://mongodb:27017/home-library
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - USE_BISAC_MAPPING=${USE_BISAC_MAPPING}
      - USE_OPEN_LIBRARY=${USE_OPEN_LIBRARY}
      - USE_MULTI_GENRE=${USE_MULTI_GENRE}
    ports:
      - "5010:5010"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: home-library-frontend
    restart: unless-stopped
    ports:
      - "8050:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
