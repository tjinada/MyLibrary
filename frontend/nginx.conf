server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Always revalidate the app shell and the service worker, so a new deploy
    # shows up on the next load instead of whenever the browser's cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # TEMPORARY: flushes the browser cache on devices still holding the old,
    # heuristically cached index.html. The app calls this endpoint on every
    # launch, so the launch after that loads the current build. Remove this
    # block once every device is on the new UI.
    location = /api/auth/verify {
        add_header Clear-Site-Data '"cache"' always;
        proxy_pass http://backend:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    location /api {
        proxy_pass http://backend:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}